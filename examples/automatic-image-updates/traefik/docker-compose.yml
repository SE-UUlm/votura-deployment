networks:
  traefik-proxy:
    name: traefik-proxy

services:
  traefik:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./traefik:/etc/traefik
      - ./ssl-certs:/ssl-certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-proxy
